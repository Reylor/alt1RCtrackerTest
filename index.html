<!doctype html><html><head><meta charset="utf-8"><title>Rune Tracker</title><style>
body{margin:0;padding:8px;background:#1b1a22;color:#e8e6f0;font:13px system-ui,sans-serif}
h1{font-size:15px;margin:0 0 6px}#st,#known,#cal{font-size:11px;color:#9a97ad;margin:4px 0}
table{width:100%;border-collapse:collapse;margin:6px 0}td,th{padding:2px 4px;text-align:right;border-bottom:1px solid #2d2b38}td:first-child,th:first-child{text-align:left}
button,input{background:#2d2b3a;color:#e8e6f0;border:1px solid #444;border-radius:4px;padding:3px 6px;font-size:12px}input{width:40px}
#tot{font-weight:600;margin:4px 0}</style></head><body>
<h1>Rune Tracker</h1><div id="st"></div><div id="tot"></div>
<table><thead><tr><th>Rune</th><th>Session</th><th>Rate</th><th>All-time</th></tr></thead><tbody id="rows"></tbody></table>
<div id="known"></div><hr style="border-color:#2d2b38">
<div>Backpack: <input id="cols" type="number" min="1"> cols × <input id="rws" type="number" min="1"> rows</div>
<p><button id="c1">Set backpack position</button> <button id="rs">Reset session</button></p>
<div id="cal"></div><p><button id="fi">Forget icons</button> <button id="ra">Clear all-time</button></p>
<script src="app.js"></script></body></html>
